name: CI

on:
  pull_request:
    branches: [main, man, loc]
  push:
    branches: [main, man, loc]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release-id: ${{ steps.release.outputs.id }}
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - name: Identify immutable release
        id: release
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$REF_TYPE" == tag ]]; then
            [[ "$REF_NAME" =~ ^v(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$ ]]
            RELEASE_ID="${REF_NAME}-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          else
            RELEASE_ID="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          echo "id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Test deployment rollback logic
        run: python3 -m unittest discover -s deploy -p 'test_*.py'

      - name: Install frontend dependencies
        run: npm ci --no-audit
        working-directory: frontend-react

      - name: Check frontend
        run: npm run lint
        working-directory: frontend-react

      - name: Test frontend
        run: npm test
        working-directory: frontend-react

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
        working-directory: frontend-react

      - name: Build frontend into API wwwroot
        run: npm run build
        working-directory: frontend-react

      - name: Restore and audit backend dependencies
        run: dotnet restore backend-dotnet/Soopi.slnx -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=high -warnaserror

      - name: Build backend
        run: dotnet build backend-dotnet/Soopi.slnx --configuration Release --no-restore

      - name: Test backend without database access
        run: dotnet test backend-dotnet/Soopi.slnx --configuration Release --no-build --no-restore

      - name: Publish API with frontend
        run: dotnet publish backend-dotnet/src/Soopi.Api/Soopi.Api.csproj --configuration Release --no-build --no-restore --output artifacts/publish

      - name: Verify package contents
        run: |
          test -f artifacts/publish/Soopi.Api.dll
          test -f artifacts/publish/wwwroot/index.html

      - name: Build image from verified package
        run: |
          set -euo pipefail
          docker build --pull -f deploy/Dockerfile --tag "soopi:$RELEASE_ID" artifacts/publish
          test "$(docker image inspect --format '{{.Config.User}}' "soopi:$RELEASE_ID")" = '1654'
          docker run --rm --entrypoint dotnet "soopi:$RELEASE_ID" --info
          docker image save "soopi:$RELEASE_ID" | gzip > artifacts/soopi-image.tar.gz

      - name: Upload verified image
        uses: actions/upload-artifact@v7
        with:
          name: soopi-${{ steps.release.outputs.id }}
          path: artifacts/soopi-image.tar.gz
          if-no-files-found: error
          retention-days: 14

  sql-server:
    name: SQL Server write and concurrency tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SQL_CONTAINER: soopi-sql-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Start a disposable SQL Server
        run: |
          set -euo pipefail
          SQL_TEST_PASSWORD="Ci!$(openssl rand -hex 20)"
          echo "::add-mask::$SQL_TEST_PASSWORD"
          echo "SQL_TEST_PASSWORD=$SQL_TEST_PASSWORD" >> "$GITHUB_ENV"
          echo "SOOPI_SQL_TEST_CONNECTION=Server=localhost,1433;Database=SoopiIntegrationTests;User Id=sa;Password=$SQL_TEST_PASSWORD;Encrypt=False;TrustServerCertificate=True" >> "$GITHUB_ENV"
          docker run --detach --name "$SQL_CONTAINER" --publish 127.0.0.1:1433:1433 \
            --env ACCEPT_EULA=Y --env MSSQL_PID=Developer --env MSSQL_SA_PASSWORD="$SQL_TEST_PASSWORD" \
            mcr.microsoft.com/mssql/server:2022-latest
          for attempt in {1..45}; do
            if docker exec --env SQLCMDPASSWORD="$SQL_TEST_PASSWORD" "$SQL_CONTAINER" \
              /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo 'SQL Server did not become ready' >&2
          exit 1

      - name: Initialize only the disposable database
        run: |
          set -euo pipefail
          docker exec --env SQLCMDPASSWORD="$SQL_TEST_PASSWORD" "$SQL_CONTAINER" \
            /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b \
            -Q 'CREATE DATABASE SoopiIntegrationTests COLLATE Latin1_General_100_CI_AI'
          for script in 01_schema.sql 02_reference_data.sql 07_access_statistics.sql; do
            docker cp "database/$script" "$SQL_CONTAINER:/tmp/$script"
            docker exec --env SQLCMDPASSWORD="$SQL_TEST_PASSWORD" "$SQL_CONTAINER" \
              /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -d SoopiIntegrationTests -i "/tmp/$script"
          done

      - name: Run SQL Server regression tests
        run: dotnet test backend-dotnet/tests/Soopi.SqlServer.Tests/Soopi.SqlServer.Tests.csproj --configuration Release --logger trx --results-directory artifacts/sql-tests -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=high -warnaserror

      - name: Upload SQL Server results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sql-server-tests
          path: artifacts/sql-tests
          if-no-files-found: warn

      - name: Remove disposable SQL Server
        if: always()
        run: docker rm --force "$SQL_CONTAINER"

  deploy:
    name: Deploy to Ubuntu VPS
    needs: [verify, sql-server]
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: soopi-production
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      RELEASE_ID: ${{ needs.verify.outputs.release-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: soopi-${{ needs.verify.outputs.release-id }}
          path: artifacts/deploy

      - name: Configure SSH with a pinned host key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$PUBLIC_URL" =~ ^https://[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          test -n "$VPS_SSH_KEY"
          test -n "$VPS_KNOWN_HOSTS"
          umask 077
          mkdir -p "$RUNNER_TEMP/soopi-ssh"
          printf '%s\n' "$VPS_SSH_KEY" > "$RUNNER_TEMP/soopi-ssh/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$RUNNER_TEMP/soopi-ssh/known_hosts"
          ssh-keygen -y -P '' -f "$RUNNER_TEMP/soopi-ssh/key" > /dev/null
          ssh-keygen -F "$VPS_HOST" -f "$RUNNER_TEMP/soopi-ssh/known_hosts" > /dev/null
          cat > "$RUNNER_TEMP/soopi-ssh/config" <<EOF
          Host soopi
            HostName $VPS_HOST
            User soopi-deploy
            IdentityFile $RUNNER_TEMP/soopi-ssh/key
            UserKnownHostsFile $RUNNER_TEMP/soopi-ssh/known_hosts
            StrictHostKeyChecking yes
            BatchMode yes
            IdentitiesOnly yes
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 3
          EOF

      - name: Upload and activate verified release
        run: |
          set -euo pipefail
          ssh -F "$RUNNER_TEMP/soopi-ssh/config" soopi "mkdir -p -- /opt/soopi/releases/$RELEASE_ID"
          scp -F "$RUNNER_TEMP/soopi-ssh/config" artifacts/deploy/soopi-image.tar.gz "soopi:/opt/soopi/releases/$RELEASE_ID/"
          ssh -F "$RUNNER_TEMP/soopi-ssh/config" soopi \
            "sudo -n /usr/bin/python3 -I /usr/local/lib/soopi/activate.py $RELEASE_ID $PUBLIC_URL"

  publish-release:
    name: Publish GitHub Release
    needs: [verify, deploy]
    if: startsWith(github.ref, 'refs/tags/v') && needs.verify.result == 'success' && needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release notes from merged changes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
