name: soopi

services:
  proxy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - /etc/soopi/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    image: soopi:${SOOPI_RELEASE:?Set the verified release ID}
    pull_policy: never
    user: "1654:1654"
    restart: unless-stopped
    mem_limit: 768m
    env_file:
      - path: /etc/soopi/soopi.env
        format: raw
    ports:
      - "127.0.0.1:5080:8080"
    volumes:
      - /var/lib/soopi/files:/data/files
      - /etc/soopi/keys:/run/soopi-keys:ro
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    restart: unless-stopped
    mem_limit: 2g
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${MSSQL_PID:?Choose a SQL Server edition}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set the initial SQL administrator password}
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sql_data:
  caddy_data:
  caddy_config:
